name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main
  # Rebuild daily so the "latest GitHub activity" indicator stays fresh.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-live
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_SITE_URL: https://peter-eshak.web.app
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TOFA7A_5E936 }}
          channelId: live
          # Firebase project IDs are permanent; the public site is "peter-eshak" (see firebase.json).
          projectId: tofa7a-5e936
